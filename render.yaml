# Render Blueprint: deploys EchoBook's read-only recipe viewer.
# Voice memos are processed on the family's own machine; the structured recipes (data/recipes.json)
# and original recordings (data/audio/) are committed and served from here. "Ask the book" runs on
# Gemma 4 through the Gemini API; Render asks for GEMINI_API_KEY when the Blueprint is created.
services:
  - type: web
    name: echobook
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ECHOBOOK_MODE
        value: viewer
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ECHOBOOK_STORYTELLER
        value: Sharma Ji
      - key: ECHOBOOK_TITLE
        value: Sharma Ji ki Rasoi
      - key: LLM_PROVIDER
        value: gemma
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: GEMINI_API_KEY
        sync: false
